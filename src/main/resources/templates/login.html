<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org" >
<head th:replace="fragments/head"/>
<body>
<nav th:replace="fragments/nav"/>
<div class="container">
    <div th:if="${logout}" class="alert alert-success alert-dismissible fade show d-flex justify-content-between align-items-center" role="alert">
        <p class="mb-0 flex-grow-1" th:text="#{logout.confirm.message}"></p>
    </div>

    <h2 th:text="#{login.message}"></h2>
    <form class="form-horizontal" method="post" action="/login" th:object="${user}">
        <div class="form-group">
            <label class="control-label col-sm-2" for="username">DNI:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="DNI" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="password">Password:</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Password" required="true" />
            </div>
        </div>
        <div th:if="${error}">
            <p class="text-danger" th:text="#{login.error}"></p>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </div>
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
    </form>
</div>
<footer th:replace="fragments/footer"/>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"/>
<body>
<nav th:replace="fragments/nav"/>
<div class="container">
    <h2 th:text="#{change.password.message}">Cambiar contraseña</h2>
    <form class="form-horizontal" method="post" action="/changePassword" th:object="${userDTO}">
        <div class="form-group">
            <label class="control-label col-sm-2" for="currentPassword" th:text="#{current.password}">
                Contraseña Actual:
            </label>
            <div class="col-sm-10">
                <input type="password" class="form-control" th:field="*{currentPassword}" id="currentPassword"/>
                <span class="text-danger" th:if="${#fields.hasErrors('currentPassword')}"
                      th:errors="*{currentPassword}"></span>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="newPassword" th:text="#{new.password}">
                Nueva Contraseña:
            </label>
            <div class="col-sm-10">
                <input type="password" class="form-control" th:field="*{password}" id="newPassword"/>
                <span class="text-danger" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-3" for="passwordConfirm" th:text="#{confirm.password}">
                Confirmar Contraseña:
            </label>
            <div class="col-sm-10">
                <input type="password" class="form-control" th:field="*{passwordConfirm}" id="passwordConfirm"/>
                <span class="text-danger" th:if="${#fields.hasErrors('passwordConfirm')}"
                      th:errors="*{passwordConfirm}"></span>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary" th:text="#{change.password.message}">
                    Cambiar contraseña
                </button>
            </div>
        </div>
    </form>
</div>
<footer th:replace="fragments/footer"/>
</body>
</html>

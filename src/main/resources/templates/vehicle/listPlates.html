<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org">
<head th:replace="fragments/head"/>
<body>
<!-- Barra de Navegación superior -->
<nav th:replace="fragments/nav"/>
<div class="container">
  <h2 th:text="${list.vehicles.plates}"></h2>
  <p th:text="${list.vehicles.plates.system}"></p>

  <table class="table table-hover">
    <thead>
    <tr>
      <th th:text="${table.vehicle.plate}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="vehicle : ${page.content}">
      <td th:text="${vehicle.plate}"></td>
      <td>
        <a th:href="@{/vehicle/routes/{id}(id=${vehicle.id})}" class="btn btn-info" th:text="${vehicle.routes}"></a>
      </td>
    </tr>
    </tbody>
  </table>
  <footer th:replace="fragments/pagination"/>
</div>
<footer th:replace="fragments/footer"/>
</body>
</html>

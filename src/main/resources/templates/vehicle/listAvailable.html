<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org">
<head th:replace="fragments/head"/>
<body>
<!-- Barra de Navegación superior -->
<nav th:replace="fragments/nav"/>

<div class="container">
  <h2 th:text="#{list.vehicle.available}"></h2>
  <p th:text="#{list.vehicle.available.free}"></p>

  <div th:fragment="vehiclesTable">
    <table class="table table-hover">
      <thead>
      <tr>
        <th th:text="#{table.vehicle.plate}"></th>
        <th th:text="#{table.vehicle.brand}"></th>
        <th th:text="#{table.vehicle.model}"></th>
        <th th:text="#{table.vehicle.kilometers}"></th>
      </tr>
      </thead>
      <tbody>
      <!-- Iterando sobre los vehículos -->
      <tr th:each="vehicle : ${page.content}">
        <td th:text="${vehicle.plate}"></td>
        <td th:text="${vehicle.brand}"></td>
        <td th:text="${vehicle.model}"></td>
        <td th:text="${vehicle.totalKilometers}"></td>
        <td>
          <a th:href="@{/vehicle/routes/{id}(id=${vehicle.id})}" class="btn btn-info" th:text="#{vehicle.routes}"></a>
          <a th:href="@{/vehicle/refuels/{id}(id=${vehicle.id})}" class="btn btn-warning" th:text="#{vehicle.refuels}"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <footer th:replace="fragments/pagination"/>
</div>

<footer th:replace="fragments/footer"/>
</body>
</html>

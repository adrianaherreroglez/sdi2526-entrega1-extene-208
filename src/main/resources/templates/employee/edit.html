<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"></head>
<body>

<!-- Barra de Navegación superior -->
<nav th:replace="fragments/nav"></nav>
<div class="container" id="main-container">
    <h2 th:text="#{edit.employee}"></h2>
    <form class="form-horizontal" method="post" th:action="${'/employee/edit/' + employee.id}" th:object="${employee}">
        <div class="form-group">
            <label class="control-label col-sm-2" for="dni">DNI:</label>
            <div class="col-sm-10">
                <input th:value="${employee.dni}" id="dni" type="text" class="form-control" name="dni"/>
                <span class="text-danger" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></span>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="name" th:text="#{name}">Nombre:</label>
            <div class="col-sm-10">
                <input th:field="${employee.name}" id="name" type="text" class="form-control" name="name"/>
                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="surname" th:text="@{surname}">Apellido:</label>
            <div class="col-sm-10">
                <input th:value="${employee.surname}" id="surname" type="text" class="form-control" name="surname"/>
                <span class="text-danger" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></span>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="role" th:text="#{role}">Rol:</label>
            <div class="col-sm-10">
                <select id="role" name="role" class="form-control">
                    <option th:each="role : ${roles}"
                            th:value="${role}"
                            th:text="${role}"
                            th:selected="${role == employeeRole}">
                    </option>
                </select>
            </div>
        </div>
        <div clas="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary" th:text="#{modify}"></button>
            </div>
        </div>
    </form>
</div>
<footer th:replace="fragments/footer"></footer>
</body>
</html>
